proxy_cache_path /tmp/team1-nginx-cache
                 levels=1:2
                 keys_zone=team1_cache:10m
                 inactive=5m;

upstream cn_backends {
    server 10.7.9.199:3001 max_fails=1 fail_timeout=10s;
    server 10.7.1.235:3002 max_fails=1 fail_timeout=10s;
}

server {
    listen 8080;
    server_name app.team1.test api.team1.test;

    location / {
        proxy_pass http://cn_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8443 ssl;
    server_name app.team1.test api.team1.test;

    # Replace these paths with the local certificate locations.
    # Never commit the corresponding private key.
    ssl_certificate /path/to/app.team1.test.crt;
    ssl_certificate_key /path/to/app.team1.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://cn_backends;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/status {
        proxy_pass http://cn_backends;

        proxy_cache team1_cache;
        proxy_cache_valid 200 10s;

        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;

        add_header Cache-Control "public, max-age=10" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
